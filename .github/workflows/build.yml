name: build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # 必須，否則抓不到 MinHook

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild WrapLocale.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: WrapLocale-${{ matrix.platform }}
          path: |
            **/Release/*.dll
