name: build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # 必須，否則抓不到 MinHook

      - uses: microsoft/setup-msbuild@v2

      - name: Check submodules
        shell: pwsh
        run: |
          Get-Content .gitmodules
          git submodule status
          Get-ChildItem -Recurse -Filter MinHook.h | Select-Object FullName

      - name: Build
        run: msbuild WrapLocale.sln /m /v:n /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:UseStructuredOutput=false

      - uses: actions/upload-artifact@v4
        with:
          name: WrapLocale-${{ matrix.platform }}
          path: |
            **/Release/*.dll
